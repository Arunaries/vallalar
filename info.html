    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        :root {
            --color-saffron: #ffea00; /* Deep Ochre/Saffron - காவி */
            --color-gold: #fafafa;    /* Royal Gold */
            --color-dark: #333333;     /* Dark Text */
            --color-light-bg: #f3f3f3; /* Off-White/Parchment */
            --font-heading: 'Tiro Tamil', serif;
            --font-body: 'Noto Sans Tamil', sans-serif;
        }

        /* 1. Global & Typography */
        body {
            font-family: var(--font-body);
            color: var(--color-dark);
            background-color: var(--color-light-bg);
            margin: 0;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        h1, h2, h3 {
            font-family: var(--font-heading);
            color: var(--color-saffron);
            text-align: center;
            margin-top: 0;
        }

        a {
            color: var(--color-saffron);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
            color: var(--color-gold);
        }

        /* Override Bootstrap Nav Link Color for Saffron/White Theme */
        .navbar-nav .nav-link {
            color: white !important;
            font-weight: 700;
            font-size: 1.1em;
            border-bottom: 2px solid transparent;
            transition: border-bottom 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            border-bottom: 2px solid var(--color-gold);
            color: var(--color-gold) !important;
        }
        
        /* 2. Hero Section (Home) */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(rgba(252, 248, 243, 0.8), rgba(252, 248, 243, 0.8)), url('placeholder-image.jpg') center/cover no-repeat;
            /* **ACTION: Replace 'placeholder-image.jpg' with a serene image of the Saint/Temple** */
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-attachment: fixed; /* Optional: for a parallax effect */
        }

        .hero h1 {
            color: var(--color-saffron);
            font-size: 3.5em;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 1.5em;
            color: var(--color-dark);
            font-style: italic;
        }

        /* 3. Main Content Area */
        .section {
            padding: 60px 0;
            border-bottom: 1px dashed #DDD;
        }

        .content-card {
            background-color: #FFFFFF;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        /* 4. Song/Poem Layout (தத்துவப் பாடல்கள்) */
        .song-list {
            list-style: none;
            padding: 0;
        }

        .song-item {
            margin-bottom: 25px;
            padding: 20px;
            border-left: 5px solid var(--color-saffron);
            background-color: #FFF;
        }

        .song-item h3 {
            text-align: left;
            margin-bottom: 10px;
        }

        .song-text {
            white-space: pre-wrap;
            font-size: 0.7em;
        }
        
        /* 5. Footer */
        .footer {
            background-color: var(--color-saffron);
            color: white;
            text-align: center;
            padding: 20px 0;
            font-size: 0.9em;
            margin-top: 40px;
        }
        
        .footer a {
            color: var(--color-gold);
        }
    </style>
</head>
<body>

                </button>
                
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">

            </div>
